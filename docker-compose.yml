services:
  nilabiru-9router:
    image: decolua/9router:0.5.116
    container_name: nilabiru-9router
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP}:20128:20128"
    environment:
      DATA_DIR: /app/data
      HOSTNAME: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD}
      REQUIRE_API_KEY: "true"
    volumes:
      - 9router-data:/app/data
      - 9router-usage:/root/.9router

  headroom:
    container_name: nilabiru-headroom
    restart: unless-stopped
    environment:
      HEADROOM_ALLOW_UNAUTHENTICATED_BIND: "1"
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN pip install --no-cache-dir "headroom-ai[proxy,ml]"
        ENV HEADROOM_TELEMETRY=off
        EXPOSE 8787
        CMD ["headroom", "proxy", "--host", "0.0.0.0", "--port", "8787"]
    volumes:
      - headroom-data:/root/.headroom
      - headroom-hf-cache:/root/.cache/huggingface

volumes:
  9router-data:
    name: nilabiru-9router_data
  9router-usage:
    name: nilabiru-9router_usage
  headroom-data:
    name: nilabiru-headroom_data
  headroom-hf-cache:
    name: nilabiru-headroom_hfcache
