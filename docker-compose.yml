services:
  nilabiru-gitea:
    image: gitea/gitea:1.24.0
    container_name: nilabiru-gitea
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP}:3000:3000"
      - "${TAILSCALE_IP}:2222:22"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=${GITEA_DB_HOST}
      - GITEA__database__NAME=${GITEA_DB_NAME}
      - GITEA__database__USER=${GITEA_DB_USER}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
      - GITEA__server__DOMAIN=${GITEA_DOMAIN}
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL}
      - GITEA__server__SSH_DOMAIN=${GITEA_DOMAIN}
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__SSH_LISTEN_PORT=22
      - GITEA__actions__ENABLED=true
      - GITEA__service__DISABLE_REGISTRATION=true
    volumes:
      - /sata-storage/gitea-data:/data

  nilabiru-act-runner:
    image: gitea/act_runner:0.2.11
    container_name: nilabiru-act-runner
    restart: unless-stopped
    environment:
      - GITEA_INSTANCE_URL=http://nilabiru-gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN}
      - GITEA_RUNNER_NAME=${GITEA_RUNNER_NAME}
    volumes:
      - act-runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      nilabiru-gitea:
        condition: service_started

volumes:
  gitea-data:
  act-runner-data:
